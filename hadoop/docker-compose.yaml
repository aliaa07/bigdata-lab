# ============================================================
# HADOOP CLUSTER — docker-compose.yaml
# Tuned for: Windows 11 + WSL2, 10 cores / 14 threads, 16GB RAM
#
# Resource limits below are LAPTOP-SIZED for exploration/lab use.
# Production-scale equivalents are commented directly beneath each
# limit — uncomment and resize when you move to real hardware.
#
# NOTE: this assumes a .wslconfig capping WSL2 at ~12GB RAM / 10 vCPU,
# leaving headroom for Windows + the WSL2 kernel itself.
# ============================================================

services:
  namenode-init:
    image: apache/hadoop:3.5.0
    container_name: namenode-init
    user: root
    restart: no
    command: chown -R hadoop:users /tmp
    networks:
      - bigdata
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - namenode_storage:/tmp/hadoop-hadoop/dfs/name

  # Explicit first-install action; never included in ordinary compose up.
  namenode-format:
    image: apache/hadoop:3.5.0
    profiles: ["init"]
    restart: "no"
    command: ["bash", "/opt/hadoop/scripts/init-namenode.sh"]
    depends_on:
      namenode-init:
        condition: service_completed_successfully
    networks:
      - bigdata
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/hadoop/scripts:ro
      - namenode_storage:/tmp/hadoop-hadoop/dfs/name
      - datanode1_storage:/tmp/hadoop-hadoop/dfs/data:ro

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    command: hdfs namenode
    restart: unless-stopped
    depends_on:
      namenode-init: 
        condition: service_completed_successfully
    ports:
      - "9870:9870"
      - "9000:9000"
    networks:
      - bigdata
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - namenode_storage:/tmp/hadoop-hadoop/dfs/name
    # --- Resource limits (lab) ---
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5
    # --- Production reference (size to real fsimage/edit-log load) ---
    # mem_limit: 8g
    # mem_reservation: 4g
    # cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://namenode:9870/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  datanode1-init:
    image: apache/hadoop:3.5.0
    container_name: datanode1-init
    user: root
    restart: no
    command: chown -R hadoop:users /tmp
    networks:
      - bigdata
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - datanode1_storage:/tmp/hadoop-hadoop/dfs/data

#  datanode2-init:
#    image: apache/hadoop:3.5.0
#    container_name: datanode2-init
#    user: root
#    restart: no
#    command: chown -R hadoop:users /tmp
#    networks:
#      - bigdata
#    volumes:
#      - ./hadoop-conf:/opt/hadoop/etc/hadoop
#      - datanode2_storage:/tmp/hadoop-hadoop/dfs/data


  datanode1:
    image: apache/hadoop:3.5.0
    container_name: datanode1
    command: hdfs datanode -fs hdfs://namenode:9000
    restart: unless-stopped
    # user: root
    depends_on:
      datanode1-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
    networks:
      - bigdata
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - datanode1_storage:/tmp/hadoop-hadoop/dfs/data
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    # mem_limit: 4g
    # mem_reservation: 2g
    # cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f DataNode || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

