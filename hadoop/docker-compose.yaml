  resourcemanager:
    image: apache/hadoop:3.5.0
    container_name: resourcemanager
    command: yarn resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - bigdata
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    # mem_limit: 4g
    # mem_reservation: 2g
    # cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://resourcemanager:8088/ws/v1/cluster/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nodemanager:
    image: apache/hadoop:3.5.0
    command: yarn nodemanager
    restart: unless-stopped
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
    depends_on:
      resourcemanager:
        condition: service_healthy
      namenode:
        condition: service_healthy
    networks:
      - bigdata

    mem_limit: 3g
    mem_reservation: 2g
    cpus: 1
    # mem_limit: 16g
    # cpus: 6
    deploy:
      replicas: 4
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f NodeManager || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

networks:
  bigdata:
    name: bigdata
    driver: bridge
    external: true

volumes:
  namenode_storage:
    name: ${BIGDATA_VOLUME_PREFIX:-bigdata}_namenode_storage
  datanode1_storage:
    name: ${BIGDATA_VOLUME_PREFIX:-bigdata}_datanode1_storage
#  datanode2_storage:
#    name: bigdata_datanode2_storage
