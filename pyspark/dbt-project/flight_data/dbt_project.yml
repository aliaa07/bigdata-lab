name: 'flight_data'
version: '1.0.0'
config-version: 2

profile: 'flight_data'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  flight_data:
    +file_format: delta
    staging:
      +materialized: ephemeral
    core:
      +materialized: incremental
      +incremental_strategy: merge
    marts:
      +materialized: incremental
      +incremental_strategy: merge

seeds:
  flight_data:
    +file_format: delta

vars:
  "dbt_date:time_zone": "UTC"