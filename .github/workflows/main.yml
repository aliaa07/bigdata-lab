# .github/workflows/docker-dbt-ci.yml
name: Docker dbt Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Hadoop + Spark need significant resources
    # GitHub hosted runners have 7GB RAM - may be tight
    # Consider self-hosted runner for production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom images
        run: make build

      - name: initialize hdfs
        run: make init

      - name: Start Hadoop stack
        run: make up
        env:
          COMPOSE_PROJECT_NAME: bigdata-ci

      - name: Install dbt dependencies
        run: make dbt-deps

      - name: Load dbt seeds
        run: make dbt-seed

      - name: Run dbt snapshots
        run: make dbt-run-snapshots

      - name: Run dbt models
        run: make dbt-run

      - name: Run dbt tests
        run: make dbt-test

      - name: Generate dbt docs
        run: make dbt-docs-generate

      - name: dbt cleanup
        run: make dbt-clean

      - name: Cleanup
        if: always()
        run: make down
        env:
          COMPOSE_PROJECT_NAME: bigdata-ci