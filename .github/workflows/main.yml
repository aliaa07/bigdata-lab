# .github/workflows/docker-dbt-ci.yml
name: Docker dbt Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep the hadoop and pyspark Compose projects distinct.
      BIGDATA_VOLUME_PREFIX: bigdata-ci-${{ github.run_id }}-${{ github.run_attempt }}

    # Hadoop + Spark need significant resources
    # GitHub hosted runners have 7GB RAM - may be tight
    # Consider self-hosted runner for production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check startup safeguards
        run: python3 hadoop/tests/test_startup.py

      - name: Build custom images
        run: make build

      - name: Match Jupyter to checkout ownership
        run: |
          echo "JUPYTER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "JUPYTER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Check Jupyter startup with Linux permissions
        run: python3 pyspark/tests/test_notebook_startup.py

      - name: Start Hadoop stack
        run: make ci-up

      - name: Install dbt dependencies
        run: make dbt-deps

      - name: Load dbt seeds
        run: make dbt-seed

      - name: Run dbt snapshots
        run: make dbt-run-snapshots

      - name: Run dbt staging
        run: make dbt-run-staging

      - name: Run dbt core
        run: make dbt-run-core

      - name: Run dbt marts
        run: make dbt-run-marts

      - name: Run dbt tests
        run: make dbt-test

      - name: Check pipeline reruns and corrections
        run: docker compose -f pyspark/docker-compose.yaml exec -T dbt python ../tests/test_pipeline.py

      - name: Generate dbt docs
        run: make dbt-docs-generate

      - name: dbt cleanup
        run: make dbt-clean

      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker ps -a > ci-diagnostics/containers.txt
          docker compose -f hadoop/docker-compose.yaml logs --no-color --tail=200 > ci-diagnostics/hadoop.log 2>&1
          docker compose -f pyspark/docker-compose.yaml logs --no-color --tail=200 > ci-diagnostics/analytics.log 2>&1
          docker inspect --format '{{json .State}}' jupyterlab > ci-diagnostics/jupyter-state.json 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ci-diagnostics/

      - name: Cleanup
        if: always()
        run: make down
